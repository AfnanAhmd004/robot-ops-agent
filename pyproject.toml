[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "LLM agent for robot-fleet operations: telemetry diagnosis, work orders, and a safety layer that does not trust the model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["robotops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
